name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install official MCP client
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax and unit tests
        run: npm run check
      - name: Offline demo smoke test
        run: npm run demo
      - name: Confirm required contest files
        run: |
          test -s README.md
          test -s CONTEST_DECLARATION.md
          test -s MCP_INTEGRATION.md
          test -s mcp-config.example.json
          test -s skills/mcdecision-lab/SKILL.md
