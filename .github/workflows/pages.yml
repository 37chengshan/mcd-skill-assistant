name: Static preview
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "mcdecision-pages"
  cancel-in-progress: false
jobs:
  readiness:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.status.outputs.enabled }}
    steps:
      - name: Check whether GitHub Pages is configured
        id: status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          response=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$response" = "200" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Pages not enabled. Skipping deployment; CI remains unaffected.'
          fi
  deploy:
    if: needs.readiness.outputs.enabled == 'true'
    needs: readiness
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: './docs'
      - id: deployment
        uses: actions/deploy-pages@v4
