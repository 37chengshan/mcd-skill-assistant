<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff9ed"><meta name="description" content="清晰易读、可朗读、中文和 English 都能使用的餐食选择陪伴页。">
<title>清晰好选 · 麦麦好选</title>
<style>
:root{--bg:#fffaee;--paper:#fff;--text:#232922;--sub:#6a7061;--line:#e3e2d7;--accent:#2d6046;--gold:#ffce4e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.7 system-ui,-apple-system,"Noto Sans SC","Arial",sans-serif}body.large{font-size:19px;line-height:1.85}body.contrast{--bg:#0e140e;--paper:#142218;--text:#fff;--sub:#eff4e6;--line:#b6c8b8;--accent:#f9db69;--gold:#f9db69}a{color:inherit}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,a:focus-visible{outline:4px solid #bb931d;outline-offset:3px}button:disabled{opacity:.55;cursor:not-allowed}body.contrast button:focus-visible,body.contrast a:focus-visible{outline-color:#ffef8a}.wrap{width:min(880px,100% - 32px);margin:auto}.top{min-height:60px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line)}.top a{text-decoration:none}.brand{font-weight:900;font-size:17px}.brand i{font-style:normal;background:var(--gold);color:#243323;border-radius:9px;padding:5px 9px;margin-right:7px}.nav{font-size:12px;color:var(--sub)}.intro{padding:24px 0 20px}.kicker{font-size:11px;font-weight:900;letter-spacing:.12em;color:#8e6d1e}body.contrast .kicker{color:#ffe68f}.intro h1{font-size:clamp(25px,3.4vw,37px);letter-spacing:-.03em;line-height:1.3;margin:8px 0}.intro p{margin:0;color:var(--sub)}.settings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:15px 0}.toggle{border:1.5px solid var(--line);border-radius:11px;min-height:51px;padding:10px;background:var(--paper);color:var(--text);font-weight:850;font-size:.8em}.toggle[aria-pressed=true]{border-color:var(--accent);background:var(--gold);color:#212a20}.panel{border:1px solid var(--line);border-radius:17px;background:var(--paper);padding:22px;margin:15px 0;box-shadow:0 7px 23px #2f34100a}h2{font-size:1.25em;margin:0 0 7px}.sub{font-size:.8em;color:var(--sub);margin:4px 0 14px}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.field label{font-size:.78em;font-weight:850;display:block}.field output{display:block;font-weight:900;color:var(--accent);font-size:1.05em}body.contrast .field output{color:#ffeb9a}input[type=range]{width:100%;min-height:32px;accent-color:var(--accent);cursor:pointer}.result{border:1.5px solid var(--line);border-radius:12px;padding:15px;margin:11px 0}.result-title{font-weight:900;font-size:1.08em}.result p{font-size:.84em;color:var(--sub);margin:7px 0}.speak{background:var(--accent);color:#fff;border:0;border-radius:9px;padding:10px 14px;min-height:46px;font-size:.8em;font-weight:850}body.contrast .speak{color:#151a12}.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:14px}.secondary{background:var(--paper);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px 15px;min-height:44px;font-size:.8em;font-weight:850}.note{background:#fff4ce;border:1px solid #e8d7a4;border-radius:10px;padding:12px;color:#68531e;font-size:.76em;margin:12px 0}body.contrast .note{background:#293b25;color:#fff1b2;border-color:#a9b77d}.foot{border-top:1px solid var(--line);padding:17px 0 35px;font-size:.73em;color:var(--sub);margin-top:25px}.skip{position:fixed;top:-100px;left:10px;padding:10px;background:var(--paper);z-index:99}.skip:focus{top:0}
@media(max-width:630px){.fields{grid-template-columns:1fr}.settings{grid-template-columns:1fr}.panel{padding:17px}.intro{padding:17px 0}.intro h1{font-size:25px}.top{min-height:55px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body>
<a class="skip" href="#main" data-i18n="skip">直接开始</a><div class="wrap">
<header class="top"><a href="./index.html" class="brand"><i>✳</i><span data-i18n="brand">麦麦好选</span></a><nav class="nav"><a href="./index.html" data-i18n="back">返回普通页面 →</a></nav></header>
<section class="intro"><div class="kicker">MADE FOR EVERYONE</div><h1 data-i18n="headline">看得更清楚，选得更自在。</h1><p data-i18n="intro">可以用更大的文字、清晰的颜色和朗读功能，慢慢找到自己想要的一餐。</p></section>
<div class="settings" aria-label="显示方式"><button type="button" id="language" class="toggle" aria-pressed="false">🌐 中文 / English</button>
<button type="button" id="largeText" class="toggle" aria-pressed="false" data-i18n="larger">Aa 放大文字</button>
<button type="button" id="contrast" class="toggle" aria-pressed="false" data-i18n="contrast">◐ 清晰对比</button></div>
<main id="main">
<section class="panel" aria-labelledby="preferences"><h2 id="preferences" data-i18n="preferences">先说说你的希望</h2><p class="sub" data-i18n="preferencesHint">这些数值只是演示参考，可以随时调整。</p>
<div class="fields"><div class="field"><label for="budget" data-i18n="budget">参考预算上限</label><output id="budgetValue" for="budget"></output><input type="range" id="budget" min="15" max="80" value="45" step="1"></div>
<div class="field"><label for="calories" data-i18n="calories">热量不超过</label><output id="caloriesValue" for="calories"></output><input type="range" id="calories" min="200" max="1400" value="850" step="50"></div>
<div class="field"><label for="protein" data-i18n="protein">蛋白质至少</label><output id="proteinValue" for="protein"></output><input type="range" id="protein" min="0" max="70" value="20" step="5"></div></div></section>
<section class="panel" aria-labelledby="results"><h2 id="results" data-i18n="results">这些搭配可以考虑</h2><p class="sub" data-i18n="resultsHint">每份都能单独点一下朗读，不会突然自动播放。</p>
<div class="note" id="provenance" data-i18n="disclaimer">全部是虚构示例，非官方菜单、价格或营养建议。</div>
<div id="cards" aria-live="polite"></div>
<div class="actions"><button type="button" class="secondary" id="stop" data-i18n="stop">■ 停止朗读</button>
<button type="button" class="secondary" id="clear" data-i18n="reset">重置阅读设置</button></div>
<p id="status" role="status" class="sub" data-i18n="status">你可以用鼠标、触屏或键盘操作。</p></section>
</main>
<footer class="foot" data-i18n="footer">麦麦好选 · 独立创意作品，不是麦当劳官方服务。</footer></div>
<script type="module" src="./readable.mjs"></script></body></html>
